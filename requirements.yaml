---
# Root Requirements File
#
# PURPOSE:
# - Serve as the entry point for ReqStream requirement processing
# - Include all reviewable requirement files from the docs/reqstream/ directory
#
# USAGE:
# - Run ReqStream against this file to process all requirements:
#
#   dotnet reqstream \
#     --requirements requirements.yaml \
#     --tests "artifacts/**/*.trx" \
#     --report docs/requirements_doc/requirements.md \
#     --justifications docs/requirements_doc/justifications.md \
#     --matrix docs/requirements_report/trace_matrix.md \
#     --enforce
#
# - Add new requirement files under docs/reqstream/ and add them to the includes
#   list below (system files first, then platform, then subsystem/unit files, then ots files)

# root-tags identifies the requirements that represent externally observable product
# behavior ("system") or repository/process quality outcomes ("quality"). ReqStream's
# --enforce mode uses this to flag any requirement not reachable (directly or via
# children) from a root-tagged requirement as orphaned - low-level requirements added
# without a connection to real functionality. Configuring root-tags here (rather than
# passing --root-tags on the command line) means orphan checking runs automatically on
# every `reqstream --enforce` invocation, without agents needing to remember a flag.
root-tags:
  - system
  - quality

includes:
  - docs/reqstream/nuget-caching.yaml
  - docs/reqstream/nuget-caching/platform-requirements.yaml
  - docs/reqstream/nuget-caching/nuget-cache.yaml
  - docs/reqstream/nuget-caching/path-helpers.yaml
  - docs/reqstream/nuget-caching/package-source-resolver.yaml
  - docs/reqstream/nuget-caching/package-downloader.yaml
  - docs/reqstream/nuget-caching/auth-failure-classifier.yaml
  - docs/reqstream/nuget-caching/credential-service-registrar.yaml
  - docs/reqstream/quality.yaml
  - docs/reqstream/ots/nuget.yaml
  - docs/reqstream/ots/xunit.yaml
  - docs/reqstream/ots/wiremock.yaml
  - docs/reqstream/ots/polyfill.yaml
  - docs/reqstream/ots/reqstream.yaml
  - docs/reqstream/ots/buildmark.yaml
  - docs/reqstream/ots/versionmark.yaml
  - docs/reqstream/ots/sarifmark.yaml
  - docs/reqstream/ots/sonarmark.yaml
  - docs/reqstream/ots/reviewmark.yaml
  - docs/reqstream/ots/pandoc.yaml
  - docs/reqstream/ots/weasyprint.yaml
  - docs/reqstream/ots/fileassert.yaml
  - docs/reqstream/ots/sysml2tools.yaml
