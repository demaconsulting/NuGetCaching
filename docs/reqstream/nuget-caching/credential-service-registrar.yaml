---
# Software Unit Requirements for the CredentialServiceRegistrar Class
#
# These requirements define the behavioral obligations of the credential-service
# registration unit used internally by the NuGetCache unit. They decompose the
# credential-service-registration responsibility of Caching-NuGetCache-HonorCredentials
# into the registration-specific responsibility of this unit.

sections:
  - title: CredentialServiceRegistrar Unit Requirements
    requirements:
      - id: Caching-CredentialServiceRegistrar-RegisterOnce
        title: >-
          The credential-service registrar shall register the NuGet SDK's default
          credential service exactly once per registrar instance.
        justification: |
          Without a registered credential service, HttpHandlerResourceV3.CredentialService
          remains null, so HttpSourceAuthenticationHandler returns a source's first
          HTTP 401 response as-is instead of retrying with credentials resolved
          from a NuGet credential-provider plugin (e.g. for JFrog Artifactory or
          Azure Artifacts). Registering via an injectable seam, rather than
          depending on shared static state directly, lets a test assert invocation
          without observing or resetting process-wide state.
        tests:
          - NuGetCache_EnsureCachedAsync_AnySource_InvokesCredentialServiceRegistrar
          - CredentialServiceRegistrar_EnsureRegistered_RepeatedCalls_RegistersExactlyOnce
          - NuGetCache_EnsureCachedAsync_FreshRealRegistrar_RegistersRealCredentialService

      - id: Caching-CredentialServiceRegistrar-DefaultWiredToRealFlow
        title: >-
          The default, process-wide credential-service registrar instance shall be
          invoked before any SourceRepository is resolved during a real (non-test)
          EnsureCachedAsync call.
        justification: |
          The production `EnsureCachedAsync` overloads must use the real, default
          registrar rather than only a test double, so that a genuine NuGet SDK
          credential service is registered for real callers, mirroring the setup
          performed internally by the dotnet CLI and MSBuild restore, before any
          source is resolved. The shared default instance memoizes registration for
          the life of the process, so the test verifies the observable end state
          (a registered credential service) after the production call.
        tests:
          - NuGetCache_EnsureCachedAsync_DefaultRegistrar_RegistersRealCredentialService

      - id: Caching-CredentialServiceRegistrar-DispatchPerCall
        title: >-
          The registrar shall install one process-wide dispatching credential service
          that reads per-call options from the ambient call context, shall behave as the
          shall behave as the non-interactive default service when no options are in scope,
          shall not replace a credential service the host registered first, and shall
          register at most one service even when registration is attempted concurrently.
        justification: |
          The NuGet SDK credential service is a process-wide singleton registered once.
          A dispatcher keyed on an AsyncLocal call context lets concurrent calls with
          different options coexist, keeps calls without options identical to the plain
          default service, and respects a host application's own registration. The default
          service is created by this library and the property is written once under a lock
          after re-reading it, which narrows (but, as the SDK exposes a plain static with no
          compare-and-set, cannot fully eliminate) the window in which a host registration
          could be overwritten.
        tests:
          - CredentialServiceRegistrar_EnsureRegistered_RegistersDispatcherOnlyWhenNoServiceExists
          - CredentialServiceRegistrar_Register_HostServiceAppearsBeforeAssignment_IsNotOverwritten
          - CredentialServiceRegistrar_Register_HostServiceAlreadyPresent_DoesNotCreateDefault
          - CredentialServiceRegistrar_Register_ConcurrentCalls_AssignExactlyOnce
          - CredentialServiceRegistrar_Register_CreateDefaultThrows_AssignsNothingAndRecovers
          - NuGetCache_ConcurrentCalls_DifferentOptions_AreIsolated
          - NuGetCache_EnsureCachedAsync_WithOptions_InvokesCredentialServiceRegistrar

      - id: Caching-CredentialServiceRegistrar-CallbackFirst
        title: >-
          The dispatcher shall consult the CredentialCallback before any credential
          provider and fall through to the providers when the callback returns null.
        justification: |
          The caller-supplied callback is the most specific source of credentials, but
          a null answer must not prevent plugin or default-credential acquisition.
        tests:
          - NuGetCache_EnsureCachedAsync_CallbackSuppliesCredentials_DownloadsFrom401Source
          - NuGetCache_EnsureCachedAsync_CallbackReturnsNull_FallsThroughAndFailsWithAuthenticationException

      - id: Caching-CredentialServiceRegistrar-LoopGuard
        title: >-
          The dispatcher shall return null for a second request for the same URI and
          request type within one call, and shall apply AuthenticationTimeout to
          credential acquisition.
        justification: |
          The NuGet SDK re-requests credentials after a rejection; without a guard a
          callback that keeps returning a bad credential would loop forever. A timeout
          bounds a callback or provider that never completes.
        tests:
          - NuGetCache_EnsureCachedAsync_CallbackCredentialsRejected_AsksOncePerRequestAndFails
          - NuGetCache_EnsureCachedAsync_CallbackNeverCompletes_TimesOutWithOperationCanceled
          - CredentialDispatcher_GetCredentialsAsync_CallbackBlocksSynchronously_TimesOutPromptly
          - NuGetCache_EnsureCachedAsync_CallbackReturnsNull_AsksOncePerUriAndType
          - CredentialDispatcher_GetCredentialsAsync_ConcurrentSameKey_AwaitsSingleCallback
          - CredentialDispatcher_GetCredentialsAsync_CallbackReturnsNull_AsksOnceButStillReachesProviders
          - NuGetCache_AuthenticationTimeout_CallbackNeverCompletes_FailsPromptlyAfterTimeout

      - id: Caching-CredentialServiceRegistrar-PerCallProviderState
        title: >-
          When a CredentialCallback is supplied, the dispatcher shall scope the credential
          providers' retry state to a single call, so that a credential provider answers a
          request for a URI in a later call as a first request even though an earlier call
          obtained a credential for that URI, while a repeated request for the same URI
          within one call is still treated as a retry.
        justification: |
          NuGet marks a request as a retry when it has already obtained a credential for the
          same provider, request type and URI, and the default network credentials provider
          (Windows integrated authentication) declines retries. Keeping that state for the
          life of the process made integrated authentication succeed only on the first call
          for a URI, so later calls failed with a spurious 401 although the credentials were
          valid. Scoping the state to one call keeps the rejected-credential detection that
          prevents loops without carrying it into later calls.
        tests:
          - CredentialDispatcher_GetCredentialsAsync_CallbackSet_RetryStateIsScopedToOneCall
          - NuGetCache_GetVersionsAsync_CallbackDeclinesTwice_ProviderServesEveryCall

      - id: Caching-CredentialServiceRegistrar-StoredFaultRethrown
        title: >-
          The dispatcher shall rethrow, unchanged and unwrapped, the exception or cancellation
          of a callback that failed on an earlier challenge for the same URI and request type
          within one call, instead of treating it as a decline.
        justification: |
          A failed callback is not an answer; silently falling through to the providers on a
          repeat challenge would hide the callback's failure and could produce a misleading
          authentication failure.
        tests:
          - CredentialDispatcher_GetCredentialsAsync_CallbackThrew_RepeatChallengeRethrowsOriginal
          - CredentialDispatcher_GetCredentialsAsync_CallbackCanceled_RepeatChallengeStaysPlainCancellation
          - CredentialDispatcher_GetCredentialsAsync_ConcurrentWaiterCallbackFaults_WaiterGetsOriginalException
          - CredentialDispatcher_GetCredentialsAsync_CallbackThrewWithTimeout_RepeatChallengeRethrowsOriginal

      - id: Caching-CredentialServiceRegistrar-PerSourceChallenge
        title: >-
          The dispatcher shall attribute an unsatisfied authentication challenge only to the
          package source being operated on when the challenge was raised, so other sources on
          the same host and port are not reported as failing authentication.
        justification: |
          Several feeds can share a host while only some require authentication. Challenged
          resource URLs may live outside the source's own path, so the source is tracked
          explicitly rather than inferred from the URL.
        tests:
          - CredentialDispatcher_GetCredentialsAsync_ChallengeInMarkedSource_AttributedToThatSourceOnly
          - CredentialDispatcher_GetCredentialsAsync_SourcesDifferingOnlyByQuery_AttributedSeparately
          - CredentialDispatcher_GetCredentialsAsync_UnmarkedAndTimeoutHop_AttributionBehaves
          - NuGetCache_EnsureCachedAsync_TwoSourcesSameHostOneAuthed_FailureNamesOnlyAuthedSource
          - NuGetCache_GetVersionsAsync_TwoSourcesSameHostOneAuthed_FailureNamesOnlyAuthedSource

      - id: Caching-CredentialServiceRegistrar-FailFastOnUnsatisfiedChallenge
        title: >-
          The dispatcher shall throw an OperationCanceledException-derived exception, instead
          of returning null, when an authentication challenge cannot be satisfied, so that
          NuGet stops retrying and the call fails with an authentication error.
        justification: |
          Returning null makes NuGet retry the rejected request with back-off delays, so an
          unauthenticated 401 source took about 8 seconds and 16 requests to fail. Canceling
          the request makes the failure prompt and deterministic.
        tests:
          - CredentialDispatcher_GetCredentialsAsync_NoCredentialAvailable_ThrowsUnsatisfiedChallenge
          - CredentialDispatcher_GetCredentialsAsync_CallerCanceled_ThrowsPlainCancellation
          - AuthFailureClassifier_IsUnsatisfiedChallenge_CallerCancellation_IsNotAuthFailure
          - NuGetCache_EnsureCachedAsync_NoCredentials_FailsFastWithoutRetries
          - NuGetCache_VersionListing_NoCredentials_FailsFastWithoutRetries

      - id: Caching-CredentialServiceRegistrar-ForbiddenReason
        title: >-
          When no credential can be supplied for an HTTP 403 (forbidden) response, the dispatcher
          shall fail the request with an unsatisfied-challenge exception that carries the status
          code 403 and the server's reason (from the X-TFS-ServiceError header, a JSON message
          body or a descriptive reason phrase), reduced to one short line without URL secrets,
          instead of reporting the failure as a 401, and shall do so without consulting the host
          credential callback or a credential provider.
        justification: |
          A 403 means the server knows who the caller is and refuses access, so more credentials
          cannot help and the user must be told what the server said (for example a missing
          ReadPackages permission). The credential service is told only that a request was
          forbidden, not why, so the handler that sees the response records the reason for the
          call. Without it a 403 was indistinguishable from a 401 and its explanation was lost.
          A later 403 that gives no reason clears the earlier one, so a failure never reports a
          reason that came from a different response. The latest recorded challenge for a source
          likewise replaces an earlier one (a 401 never displaces a 403), and the HTTP handler
          provider is swapped in without constructing the other core providers eagerly.
        tests:
          - CredentialDispatcher_GetCredentialsAsync_ForbiddenNoCredential_FailsWithStatus403AndRecordedReason
          - CredentialDispatcher_GetCredentialsAsync_ReasonedThenBareForbidden_DoesNotReportStaleReason
          - CredentialDispatcher_GetCredentialsAsync_ReasonedForbiddenThenBareForbiddenChallenge_ReplacesRecordedChallenge
          - CredentialDispatcher_GetCredentialsAsync_ChallengeStatusOrdering_KeepsForbiddenOverUnauthorized
          - ForbiddenReasonHandlerProvider_Install_DoesNotConstructProvidersUntilRead
          - CredentialDispatcher_GetCredentialsAsync_ForbiddenWithCallback_DoesNotInvokeCallback
          - ForbiddenReasonHandler_Forbidden_RecordsSanitizedReasonInPriorityOrder
          - ForbiddenReasonHandler_OversizedBody_FallsBackToReasonPhrase
          - NuGetCache_EnsureCachedAsync_Forbidden_ReportsStatusAndServerReasonWithoutRetries
          - NuGetCache_GetVersionsAsync_ForbiddenWithJsonBody_ReportsMessageAsServerReason
