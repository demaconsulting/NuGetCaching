---
# Software Unit Requirements for the PathHelpers Class
#
# These requirements define the behavioral obligations of the path-combination
# utility used internally by the NuGetCache unit. They decompose the safe-caching
# requirement into the path-safety responsibilities of this unit.

sections:
  - title: PathHelpers Unit Requirements
    requirements:
      - id: Caching-PathHelpers-Combine
        title: >-
          The path-combination utility shall safely combine a base path and a
          relative path that stays within the base directory, returning the
          resulting path.
        justification: |
          Provides the nominal path-combination capability used by NuGetCache to
          construct the on-disk locations for package identifiers and version strings
          sourced from external NuGet feeds, ensuring each segment is appended to the
          correct base directory.
        tests:
          - PathHelpers_SafePathCombine_ValidPaths_CombinesCorrectly
          - PathHelpers_SafePathCombine_DotDotPrefixedName_CombinesCorrectly
          - PathHelpers_SafePathCombine_NestedPaths_CombinesCorrectly
          - PathHelpers_SafePathCombine_SimpleFilename_CombinesCorrectly
          - PathHelpers_SafePathCombine_GuidBasedFilename_CombinesSuccessfully
          - PathHelpers_SafePathCombine_EmptyRelativePath_ReturnsBasePath
          - PathHelpers_SafePathCombine_CurrentDirectoryReference_CombinesCorrectly
          - PathHelpers_SafePathCombine_NullBasePath_ThrowsArgumentNullException
          - PathHelpers_SafePathCombine_NullRelativePath_ThrowsArgumentNullException

      - id: Caching-PathHelpers-RejectTraversal
        title: >-
          The path-combination utility shall reject any combination that would
          escape the base directory, throwing ArgumentException.
        justification: |
          Prevents path-traversal vulnerabilities when constructing file paths from
          user-supplied or external inputs, which could otherwise allow access to
          files outside the intended cache directory.
        tests:
          - PathHelpers_SafePathCombine_PathTraversalWithDoubleDots_ThrowsArgumentException
          - PathHelpers_SafePathCombine_DoubleDotsInMiddle_ThrowsArgumentException
          - PathHelpers_SafePathCombine_AbsolutePath_ThrowsArgumentException
