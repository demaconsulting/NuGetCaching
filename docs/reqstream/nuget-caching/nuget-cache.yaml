---
# Software Unit Requirements for the NuGetCache Class
#
# These requirements define the behavioral obligations of the NuGetCache unit
# for programmatic NuGet package caching. They decompose the system-level
# package-caching requirement into the responsibilities of this unit.

sections:
  - title: NuGetCache Unit Requirements
    requirements:
      - id: Caching-NuGetCache-EnsureCached
        title: The library shall ensure a specified NuGet package version is available in the local cache.
        justification: |
          Provides the core caching functionality of the library, allowing callers to ensure
          a specific NuGet package version is available in the local cache before use.
        children:
          - Caching-PathHelpers-Combine
          - Caching-PathHelpers-RejectTraversal
          - Caching-NuGetCache-InvalidVersion
          - Caching-NuGetCache-TransientFailure
          - Caching-NuGetCache-MultiSource
          - Caching-NuGetCache-V2Fallback
          - Caching-NuGetCache-CacheHit
          - Caching-NuGetCache-HonorCredentials
          - Caching-NuGetCache-AuthDiagnostic
          - Caching-PackageSourceResolver-Resolve
          - Caching-PackageDownloader-DownloadOutcome
          - Caching-PackageDownloader-PackagePathConvention
          - Caching-OTS-NuGetProtocol
          - Caching-OTS-NuGetConfiguration
        tests:
          - NuGetCache_EnsureCachedAsync_ValidPackageId_ReturnsPackageFolder
          - NuGetCache_EnsureCachedAsync_CalledTwiceWithSamePackage_ReturnsSamePath
          - NuGetCache_EnsureCachedAsync_V3PackageRegistered_ReturnsExistingPackagePath

      - id: Caching-NuGetCache-NullPackageId
        title: >-
          The EnsureCachedAsync method shall throw ArgumentNullException when
          packageId is null.
        justification: |
          Null validation on the packageId argument of the EnsureCachedAsync method ensures
          callers receive a clear ArgumentNullException identifying packageId as the null
          parameter. This is one of two unit-level decompositions of Caching-Sys-NullValidation,
          specifying that the public API method performs this check before any I/O or version
          parsing occurs.
        tests:
          - NuGetCache_EnsureCachedAsync_NullPackageId_ThrowsArgumentNullException

      - id: Caching-NuGetCache-NullVersion
        title: >-
          The EnsureCachedAsync method shall throw ArgumentNullException when
          version is null.
        justification: |
          Null validation on the version argument of the EnsureCachedAsync method ensures
          callers receive a clear ArgumentNullException identifying version as the null
          parameter. This is one of two unit-level decompositions of Caching-Sys-NullValidation,
          specifying that the public API method performs this check before any I/O or version
          parsing occurs.
        tests:
          - NuGetCache_EnsureCachedAsync_NullVersion_ThrowsArgumentNullException

      - id: Caching-NuGetCache-NotFound
        title: >-
          The library shall report an error when the requested package cannot be
          found in any configured NuGet source.
        justification: |
          Ensures callers receive a clear, actionable error when the requested package is absent
          from all configured sources, distinguishing this condition from a null-argument error
          or a transient network failure on a single source.
        tests:
          - NuGetCache_EnsureCachedAsync_PackageAbsentFromAllSources_ThrowsInvalidOperationException
          - NuGetCache_EnsureCachedAsync_PackageAbsentFromAllSources_ExceptionMessageContainsPackageIdAndVersion
          - NuGetCache_EnsureCachedAsync_V3PackageAbsent_ThrowsInvalidOperationException
          - NuGetCache_EnsureCachedAsync_V3AndV2BothFail_ThrowsInvalidOperationException
          - NuGetCache_EnsureCachedAsync_NetworkFailureOnIndex_ThrowsInvalidOperationException
          - NuGetCache_EnsureCachedAsync_V3IndexFailsNetworkFailureOnFallback_ThrowsInvalidOperationException
          - NuGetCache_EnsureCachedAsync_DifferentPackageRegistered_ThrowsInvalidOperationException
          - NuGetCache_EnsureCachedAsync_DownloadProtocolError_ThrowsInvalidOperationException
          - NuGetCache_EnsureCachedAsync_DownloadNetworkFailure_ThrowsInvalidOperationException

      - id: Caching-NuGetCache-InvalidVersion
        title: >-
          The EnsureCachedAsync method shall reject a version string that is not
          a valid NuGet version with an ArgumentException.
        justification: |
          NuGetVersion.Parse is used to validate and normalize the version string
          early in the call. Propagating its ArgumentException provides callers
          with a clear, actionable signal that the version string is malformed,
          distinguishing this condition from a null argument or a package-not-found
          error.
        tests:
          - NuGetCache_EnsureCachedAsync_InvalidVersion_ThrowsArgumentException

      - id: Caching-NuGetCache-TransientFailure
        title: >-
          The EnsureCachedAsync method shall continue querying remaining configured
          sources when a source is unreachable or returns a transient network error.
        justification: |
          Network outages on individual feeds are non-actionable and should not
          prevent the library from finding a package on another available source.
          Silently skipping unreachable sources mirrors the behavior of the dotnet
          CLI restore, ensuring the library remains functional when one of several
          configured feeds is temporarily unavailable.
        children:
          - Caching-PackageSourceResolver-TransientFailure
        tests:
          - NuGetCache_EnsureCachedAsync_NetworkFailureOnIndex_ThrowsInvalidOperationException
          - NuGetCache_EnsureCachedAsync_V3IndexFailsNetworkFailureOnFallback_ThrowsInvalidOperationException

      - id: Caching-NuGetCache-MultiSource
        title: >-
          The EnsureCachedAsync method shall search all configured and enabled
          NuGet sources in order until the package is found.
        justification: |
          Users may configure multiple NuGet sources (corporate feed plus nuget.org
          fallback). Searching all sources ensures the package is found even when it
          is not available in the first source, mirroring the behavior of the dotnet
          CLI restore.
        tests:
          - NuGetCache_EnsureCachedAsync_PackageInSecondSourceOnly_ReturnsExistingPackagePath

      - id: Caching-NuGetCache-V2Fallback
        title: >-
          The EnsureCachedAsync method shall fall back to a v2 OData endpoint when
          a configured v3 index URL fails with a protocol error.
        justification: |
          Some package feeds expose a v2-only endpoint at the base URL even when a
          v3-style index.json URL is configured. Automatic fallback to the base URL
          as a v2 OData endpoint allows the library to serve these feeds without
          requiring configuration changes by the user.
        children:
          - Caching-PackageSourceResolver-FallbackOnProtocolError
          - Caching-PackageSourceResolver-NoFallbackForNonIndexUrl
          - Caching-PackageSourceResolver-NoV2FallbackAfterAuthFailure
        tests:
          - NuGetCache_EnsureCachedAsync_V3IndexFailsV2PackageRegistered_ReturnsExistingPackagePath

      - id: Caching-NuGetCache-CacheHit
        title: >-
          The EnsureCachedAsync method shall return the cached path without network
          communication when the package is already fully installed in the global
          packages folder.
        justification: |
          Avoiding redundant network calls improves performance and enables offline
          operation for packages already present locally. The .nupkg.metadata
          sentinel file is used as the cache-hit indicator to avoid returning a
          partially-extracted package.
        children:
          - Caching-PackageDownloader-PackagePathConvention
        tests:
          - NuGetCache_EnsureCachedAsync_PackageAlreadyCached_ReturnsCachedPathWithoutHttpCalls

      - id: Caching-NuGetCache-HonorCredentials
        title: >-
          The EnsureCachedAsync method shall honor configured source credentials,
          successfully accessing an authenticated NuGet source when valid
          credentials are configured for it.
        justification: |
          Authenticated V3 feeds (e.g. JFrog Artifactory, Azure Artifacts) require
          credentials to be applied before a request succeeds. Static
          packageSourceCredentials in nuget.config are applied directly by the
          NuGet HTTP stack and can succeed even without credential-service
          registration; registering the NuGet SDK's default credential service is
          still performed - mirroring the setup done internally by the dotnet CLI
          and MSBuild restore - because it is needed when a credential-provider
          plugin or ICredentialService-mediated retry is required (e.g. Azure
          Artifacts or JFrog credential-provider plugins), even though it is not
          exercised by static-credential scenarios.
        children:
          - Caching-CredentialServiceRegistrar-RegisterOnce
          - Caching-CredentialServiceRegistrar-DefaultWiredToRealFlow
        tests:
          - NuGetCache_EnsureCachedAsync_AuthenticatedSourceWithCredentials_ReturnsExistingPackagePath
          - NuGetCache_EnsureCachedAsync_AnySource_InvokesCredentialServiceRegistrar
          - NuGetCache_EnsureCachedAsync_DefaultRegistrar_RegistersRealCredentialService

      - id: Caching-NuGetCache-AuthDiagnostic
        title: >-
          The EnsureCachedAsync method shall report an actionable diagnostic
          identifying the source and HTTP status code when a source rejects a
          request with 401 (Unauthorized) or 403 (Forbidden), instead of silently
          treating the failure as a transient network error.
        justification: |
          Authenticated V3 feeds (e.g. JFrog Artifactory, Azure Artifacts) reject
          unauthenticated requests with a 401/403 response that is otherwise
          indistinguishable, from the caller's perspective, from a transient network
          failure or a genuine "package not found" outcome. Surfacing the actionable
          401/403 diagnostic lets callers immediately identify a credentials
          problem on a specific source rather than receiving a generic "not found"
          error with no diagnostic detail.
        children:
          - Caching-AuthFailureClassifier-DetectUnauthorized
          - Caching-AuthFailureClassifier-DetectInInnerChain
          - Caching-AuthFailureClassifier-NoFalsePositive
          - Caching-AuthFailureClassifier-ActionableMessage
          - Caching-PackageDownloader-AuthDiagnostic
        tests:
          - NuGetCache_EnsureCachedAsync_AuthenticatedSourceWithoutCredentials_ThrowsWithActionableDiagnostic

      - id: Caching-NuGetCache-SingleApiShape
        title: >-
          The EnsureCachedAsync, GetVersionsAsync, and ListVersionsAsync methods shall each
          be a single public method with optional root, options, and cancellation-token
          parameters (options before the token), and shall reject a null, empty, or
          white-space package ID.
        justification: |
          A single method per operation, with every configuration knob in one optional
          NuGetCacheOptions argument, keeps the API small and lets new options be added
          without adding overloads. Validating the package ID up front gives callers a clear
          error before any I/O. A call that supplies no options runs with every option off.
        tests:
          - NuGetCacheOptions_Default_HasAllOptionsOff
          - NuGetCache_PublicMethods_Signature_HasOptionalRootOptionsThenToken
          - NuGetCache_PublicMethods_InvalidArguments_Throw
          - NuGetCache_GetVersionsAsync_PublicSignature_ExposesOnlyStrings

      - id: Caching-NuGetCache-CredentialCallback
        title: >-
          When a CredentialCallback is supplied in the options, the library shall
          consult it before any credential provider, use the credential it returns to
          access an authenticated source, and fall through to the credential
          providers when it returns null.
        justification: |
          Host applications often hold the credentials (or can prompt for them) and
          need to supply them for a 401 challenge without configuring a plugin. A null
          answer means "no opinion" and must not block provider-based credential
          acquisition. A repeated request for the same URI and request type indicates
          the previous credential was rejected, so the callback is not asked again, which
          prevents an endless retry loop.
        children:
          - Caching-CredentialServiceRegistrar-DispatchPerCall
          - Caching-CredentialServiceRegistrar-CallbackFirst
          - Caching-CredentialServiceRegistrar-LoopGuard
          - Caching-CredentialServiceRegistrar-FailFastOnUnsatisfiedChallenge
        tests:
          - NuGetCache_EnsureCachedAsync_CallbackSuppliesCredentials_DownloadsFrom401Source
          - NuGetCache_GetVersionsAsync_CallbackSuppliesCredentials_ReturnsVersions
          - NuGetCache_EnsureCachedAsync_CallbackReturnsNull_FallsThroughAndFailsWithAuthenticationException
          - NuGetCache_EnsureCachedAsync_CallbackCredentialsRejected_AsksOncePerRequestAndFails

      - id: Caching-NuGetCache-AuthenticationException
        title: >-
          Every operation shall throw NuGetAuthenticationException, identifying the source
          and URI, when the operation fails and a source rejected a request with 401 or 403,
          whether or not options were supplied.
        justification: |
          Callers need to distinguish an authentication failure from other failures
          programmatically instead of parsing a message. The exception derives from
          InvalidOperationException, so handlers that catch InvalidOperationException keep
          working.
        children:
          - Caching-PackageDownloader-AuthFailureInfo
        tests:
          - NuGetAuthenticationException_Properties_AreExposed
          - NuGetCache_UnauthorizedWithoutCredentials_ThrowsNuGetAuthenticationException
          - NuGetCache_EnsureCachedAsync_AuthenticatedSourceWithoutCredentials_ThrowsWithActionableDiagnostic
          - NuGetCache_ListVersionsAsync_Unauthorized_ThrowsNuGetAuthenticationException
          - NuGetCache_ListVersionsAsync_UnauthorizedRegistration_ThrowsNuGetAuthenticationException

      - id: Caching-NuGetCache-AuthenticationTimeout
        title: >-
          When AuthenticationTimeout is set, the library shall cancel the operation with
          OperationCanceledException if credential acquisition does not complete in time.
        justification: |
          A credential callback or interactive provider that waits for a human can
          block an unattended build forever. A bounded wait lets the caller fail fast.
          The timeout abandons the wait and cancels the token supplied to the callback;
          it does not terminate an external credential-provider plugin process, because
          NuGet's plugin manager owns it and ends it on its idle timeout or at process exit.
          The cancellation is guaranteed even when NuGet retries or wraps the
          failed request, for both EnsureCachedAsync and GetVersionsAsync. A timeout that
          is zero, negative (other than Timeout.InfiniteTimeSpan) or longer than
          Int32.MaxValue milliseconds is rejected with ArgumentOutOfRangeException.
        tests:
          - NuGetCacheOptions_Validate_ValidTimeouts_DoNotThrow
          - NuGetCache_InvalidAuthenticationTimeout_ThrowsArgumentOutOfRangeException
          - NuGetCache_InvalidAuthenticationTimeout_ValidatedBeforeSettingsLoad
          - NuGetCache_EnsureCachedAsync_CallbackNeverCompletes_TimesOutWithOperationCanceled
          - NuGetCache_GetVersionsAsync_CallbackNeverCompletes_TimesOutWithOperationCanceled
          - CredentialDispatcher_GetCredentialsAsync_TimedOut_SubsequentRequestsCancelWithoutCallback
          - NuGetCache_AuthenticationTimeout_CallbackNeverCompletes_FailsPromptlyAfterTimeout

      - id: Caching-NuGetCache-OptionsIsolation
        title: >-
          Options supplied to one call shall not affect any other call, including calls
          running concurrently with different options.
        justification: |
          The NuGet SDK credential service is process-wide, so per-call behavior must
          be carried by a per-call context rather than shared mutable state.
        tests:
          - NuGetCache_ConcurrentCalls_DifferentOptions_AreIsolated

      - id: Caching-NuGetCache-Logging
        title: >-
          When a Logger is supplied, the library shall forward NuGet SDK log messages to
          it and shall not write the credential secret to it.
        justification: |
          Diagnosing credential and download problems requires the NuGet SDK's
          messages, and credentials must never leak into logs.
        children:
          - Caching-OTS-LoggingAbstractions
        tests:
          - NuGetCache_EnsureCachedAsync_Logger_ReceivesMessagesWithoutSecret
          - NuGetCredential_ToString_RedactsSecret
          - NuGetCredential_ToString_IncludesUserNameAndRedactsSecret
          - NuGetCredential_Interpolation_DoesNotExposeSecret
          - NuGetCredential_Formatted_DoesNotExposeSecret

      - id: Caching-NuGetCache-GetVersions
        title: >-
          The GetVersionsAsync method shall return the available versions of a package as
          strings, exposing no NuGet types in its public signature.
        justification: |
          Callers need to discover which versions of a package exist before choosing one to
          cache. Returning plain strings keeps NuGet types out of the public API, and each
          returned string is directly usable with EnsureCachedAsync.
        tests:
          - NuGetCache_GetVersionsAsync_ReturnedVersionUsableByEnsureCachedAsync
          - NuGetCache_GetVersionsAsync_PublicSignature_ExposesOnlyStrings

      - id: Caching-NuGetCache-GetVersionsNormalization
        title: >-
          The GetVersionsAsync method shall return each version in its normalized
          string form.
        justification: |
          Feeds may advertise non-normalized forms (for example "1.0"); returning the
          normalized form gives callers one canonical spelling per version.
        tests:
          - NuGetCache_GetVersionsAsync_NonNormalizedVersions_ReturnsNormalizedStrings

      - id: Caching-NuGetCache-GetVersionsOrdering
        title: >-
          The GetVersionsAsync method shall return versions sorted in ascending
          semantic-version order.
        justification: |
          Callers select the latest or a range of versions from the result; a semantic
          (not textual) ascending order makes the last element the newest release.
        tests:
          - NuGetCache_GetVersionsAsync_MultipleVersions_ReturnsAscendingNormalizedStrings
          - NuGetCache_GetVersionsAsync_UnsortedVersions_ReturnsSemanticAscendingOrder

      - id: Caching-NuGetCache-GetVersionsDeduplication
        title: >-
          The GetVersionsAsync method shall return each version once when the same
          version is offered by more than one source.
        justification: |
          Mirrored or overlapping feeds advertise the same versions; callers must not see
          duplicate entries.
        tests:
          - NuGetCache_GetVersionsAsync_VersionsInMultipleSources_MergedDeduplicated

      - id: Caching-NuGetCache-GetVersionsSources
        title: >-
          The GetVersionsAsync method shall query only the enabled remote (HTTP/HTTPS)
          package sources permitted for the package by package source mapping, excluding
          local folder sources unless IncludeLocalSources is set or the local source is
          named explicitly in Sources.
        justification: |
          Version discovery answers what a feed offers. Local folder feeds and the global
          packages folder are not remote feeds, so they are excluded by default, while enabled-source
          selection and package source mapping match EnsureCachedAsync to prevent drift.
        children:
          - Caching-PackageSourceResolver-Resolve
          - Caching-OTS-NuGetProtocol
          - Caching-OTS-NuGetConfiguration
        tests:
          - NuGetCache_GetVersionsAsync_PackageSourceMapping_HonorsMapping
          - NuGetCache_GetVersionsAsync_LocalFolderSource_IsIgnored
          - NuGetCache_GetVersionsAsync_NonHttpNonLocalSource_IsIgnored

      - id: Caching-NuGetCache-GetVersionsAuth
        title: >-
          The GetVersionsAsync method shall register the NuGet credential service before
          contacting any source and honor configured source credentials.
        justification: |
          Authenticated private feeds must be usable for version discovery exactly as they
          are for package caching.
        children:
          - Caching-CredentialServiceRegistrar-RegisterOnce
        tests:
          - NuGetCache_GetVersionsAsync_AuthenticatedSourceWithCredentials_ReturnsVersions
          - NuGetCache_GetVersionsAsync_AnySource_InvokesCredentialServiceRegistrar

      - id: Caching-NuGetCache-GetVersionsSourceFailure
        title: >-
          The GetVersionsAsync method shall skip a source that fails and continue with
          the remaining sources.
        justification: |
          One unreachable feed must not hide versions that other configured feeds provide.
        tests:
          - NuGetCache_GetVersionsAsync_SourceUnreachable_ContinuesToNextSource

      - id: Caching-NuGetCache-GetVersionsAllSourcesFail
        title: >-
          The GetVersionsAsync method shall throw InvalidOperationException describing each
          failed source when no versions are found and at least one source failed.
        justification: |
          Consistent with EnsureCachedAsync, bad or unreachable sources must be reported rather
          than disguised as an empty result, which would mean the package does not exist.
        tests:
          - NuGetCache_GetVersionsAsync_AllSourcesFail_ThrowsInvalidOperationException

      - id: Caching-NuGetCache-GetVersionsCancellation
        title: >-
          The GetVersionsAsync method shall honor the supplied cancellation token by
          propagating OperationCanceledException rather than treating cancellation as a
          skipped source.
        justification: |
          Callers must be able to abort discovery promptly; swallowing cancellation as a
          source failure would return misleading partial results.
        tests:
          - NuGetCache_GetVersionsAsync_CancelledToken_ThrowsOperationCanceledException
          - NuGetCache_GetVersionsAsync_CancelledTokenNoHttpSources_ThrowsBeforeRegistration

      - id: Caching-NuGetCache-GetVersionsPrerelease
        title: >-
          The GetVersionsAsync method shall exclude prerelease versions unless
          includePrerelease is true.
        justification: |
          Most callers want only stable versions; prerelease versions are opt-in, matching
          NuGet tooling conventions.
        tests:
          - NuGetCache_GetVersionsAsync_PrereleaseExcludedByDefault
          - NuGetCache_GetVersionsAsync_IncludePrerelease_ReturnsPrereleaseVersions

      - id: Caching-NuGetCache-GetVersionsNotFound
        title: >-
          The GetVersionsAsync method shall return an empty list, without throwing, when
          no configured source carries the package.
        justification: |
          For version discovery, absence is an expected answer rather than an error, so
          callers can test for emptiness instead of catching exceptions.
        tests:
          - NuGetCache_GetVersionsAsync_PackageAbsent_ReturnsEmptyList

      - id: Caching-NuGetCache-GetVersionsNullArguments
        title: >-
          The GetVersionsAsync method shall throw ArgumentNullException when
          packageId is null.
        justification: |
          Null validation gives callers a clear, actionable error before any I/O occurs.
        tests:
          - NuGetCache_GetVersionsAsync_NullPackageId_ThrowsArgumentNullException
          - NuGetCache_GetVersionsAsync_NullInternalArguments_ThrowsArgumentNullException

      - id: Caching-NuGetCache-Sources
        title: >-
          When Sources is supplied, the library shall use exactly those sources instead of
          the configured ones, resolving each entry as a configured source name, an
          http(s) URL, a file URI, or a rooted path, bypassing package source mapping,
          collapsing duplicates, and rejecting any other entry with ArgumentException.
        justification: |
          Callers that know where a package lives (a specific feed or local folder) need to
          direct a call there without editing nuget.config. Naming a configured source keeps
          its credentials; anything unrecognized is an error rather than a silently ignored
          entry.
        tests:
          - NuGetCacheOptions_Validate_InvalidSourceEntry_ThrowsArgumentException
          - NuGetCacheOptions_Validate_ValidSources_DoNotThrow
          - NuGetCache_Sources_UnknownRelativeEntry_ThrowsArgumentException
          - NuGetCache_Sources_ExplicitUrl_ReplacesConfiguredSources
          - NuGetCache_Sources_ConfiguredName_ResolvesToConfiguredSource
          - NuGetCache_Sources_ExplicitSource_BypassesSourceMapping
          - NuGetCache_Sources_DuplicateEntries_QueryTheSourceOnce
          - NuGetCache_Sources_QueryStringJsonUrl_LogsV2Warning

      - id: Caching-NuGetCache-IncludeLocalSources
        title: >-
          The version operations shall include enabled local folder sources only when
          IncludeLocalSources is set or the local source is named in Sources, while
          EnsureCachedAsync shall always consult local sources.
        justification: |
          Local feeds are common in offline and build-output scenarios but were historically
          excluded from discovery; an opt-in keeps the default behavior while enabling them.
        tests:
          - NuGetCache_GetVersionsAsync_LocalSource_RequiresIncludeLocalSourcesOrExplicitSource
          - NuGetCache_EnsureCachedAsync_LocalSource_IsAlwaysConsulted

      - id: Caching-NuGetCache-GetCachedVersions
        title: >-
          The GetCachedVersions method shall synchronously return, without any network
          access, the completely installed versions of a package in the global packages
          folder in ascending order, and an empty list when none are installed.
        justification: |
          Offline callers need to know what is already available before deciding to download;
          the completeness marker avoids reporting partially extracted packages.
        tests:
          - NuGetCache_GetCachedVersions_InstalledVersions_ReturnsCompleteOnesSorted
          - NuGetCache_GetCachedVersions_NotInstalled_ReturnsEmptyWithoutNetworkAccess
          - NuGetCache_GetCachedVersions_RootWithConfig_ReadsConfiguredGlobalPackagesFolder

      - id: Caching-NuGetCache-ListVersions
        title: >-
          The ListVersionsAsync method shall return, per version, the source, whether the
          version is listed, and its publication date when the source provides them, falling
          back to the flat version list (listed, no date) otherwise.
        justification: |
          Callers choosing a version often need to skip unlisted versions or order by release
          date, which the plain string list cannot express. The fallback keeps the method
          usable against sources without package metadata.
        tests:
          - NuGetCache_ListVersionsAsync_RegistrationMetadata_ReturnsListedStateAndPublishedDate
          - NuGetCache_ListVersionsAsync_NoRegistrationMetadata_FallsBackToFlatList
          - NuGetCache_ListVersionsAsync_NoRegistrationResource_FallsBackToFlatList
          - NuGetCache_ListVersionsAsync_VersionInTwoSources_FirstSourceWins
          - NuGetPackageVersion_Record_HasValueSemantics

      - id: Caching-NuGetCache-RequireSignedPackages
        title: >-
          When RequireSignedPackages is set, EnsureCachedAsync shall reject a package that
          is unsigned or has an invalid signature with InvalidOperationException, both when
          downloading it and when it is already installed.
        justification: |
          Supply-chain-sensitive callers must be able to refuse unsigned content per call
          without changing nuget.config, and the already-installed fast path must not bypass
          that policy.
        tests:
          - NuGetCache_RequireSignedPackages_UnsignedPackageDownload_ThrowsInvalidOperationException
          - NuGetCache_RequireSignedPackages_Off_AcceptsUnsignedPackage
          - NuGetCache_RequireSignedPackages_UnsignedPackageAlreadyInstalled_RejectedOnCacheHit
          - NuGetCache_RequireSignedPackages_InvalidlySignedPackageDownload_ThrowsInvalidOperationException
          - NuGetCache_RequireSignedPackages_InvalidlySignedPackageAlreadyInstalled_RejectedOnCacheHit
          - NuGetCache_RequireSignedPackages_SignedPackageDownload_Succeeds
          - NuGetCache_RequireSignedPackages_TrustedAuthorSignerMatches_Succeeds
          - NuGetCache_RequireSignedPackages_TrustedRepositorySignerMatches_Succeeds
          - NuGetCache_RequireSignedPackages_TrustedSignerDoesNotMatch_ThrowsInvalidOperationException
          - NuGetCache_RequireSignedPackages_SignedPackageAlreadyInstalled_AcceptedOnCacheHit
          - NuGetCache_RequireSignedPackages_SignedPackageAlreadyInstalled_SignerMismatchRejectedOnCacheHit
