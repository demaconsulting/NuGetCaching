---
# NuGet Client SDK OTS Software Requirements
#
# Requirements for the NuGet client SDK packages that the library depends on
# at runtime for package source communication and configuration reading.

sections:
  - title: OTS Software Requirements
    sections:
      - title: NuGet Client SDK Requirements
        requirements:
          - id: Caching-OTS-NuGetProtocol
            title: NuGet.Protocol shall communicate with NuGet package sources and download packages.
            justification: |
              NuGet.Protocol provides the NuGet client SDK used by the library to
              communicate with v2 and v3 NuGet package sources, stream package content, and install
              packages into the global packages folder. It is a direct runtime dependency of the
              library. Passing tests that exercise the full download-and-cache path confirm that the
              protocol library is functioning correctly.
            tags: [ots]
            tests:
              - NuGetCache_EnsureCachedAsync_ValidPackageId_ReturnsPackageFolder

          - id: Caching-OTS-NuGetConfiguration
            title: NuGet.Configuration shall read NuGet settings from the local machine configuration.
            justification: |
              NuGet.Configuration provides the settings infrastructure used by the
              library to load the NuGet configuration hierarchy (machine-wide, user, and
              project-level), resolve the global packages folder path, load package source
              definitions, and read package source mapping rules. It is a direct runtime dependency
              of the library. Passing tests that exercise the full configuration-and-cache path
              confirm that the configuration library is functioning correctly.
            tags: [ots]
            tests:
              - NuGetCache_EnsureCachedAsync_ValidPackageId_ReturnsPackageFolder

          - id: Caching-OTS-LoggingAbstractions
            title: >-
              Microsoft.Extensions.Logging.Abstractions shall provide the ILogger contract through
              which callers receive diagnostic messages from the library.
            justification: |
              Microsoft.Extensions.Logging.Abstractions is a direct runtime dependency that
              supplies the ILogger type accepted by NuGetCacheOptions.Logger and the log levels
              used to translate NuGet SDK messages. A passing test that supplies a logger and
              observes the forwarded messages confirms the abstraction works as the library
              relies on it.
            tags: [ots]
            tests:
              - NuGetCache_EnsureCachedAsync_Logger_ReceivesMessagesWithoutSecret
