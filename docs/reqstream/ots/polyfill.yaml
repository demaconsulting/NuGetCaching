---
# Polyfill OTS Software Requirements
#
# Requirements for the Polyfill package that provides Path.GetRelativePath and
# ArgumentNullException.ThrowIfNull compatibility on netstandard2.0 targets.

sections:
  - title: OTS Software Requirements
    sections:
      - title: Polyfill Requirements
        requirements:
          - id: Caching-OTS-Polyfill
            title: >-
              Polyfill shall provide Path.GetRelativePath on netstandard2.0 targets
              where the API is absent.
            justification: |
              The Polyfill package is a source-generator-based compatibility library. The library
              project targets netstandard2.0; on that target Polyfill injects a compatible
              Path.GetRelativePath, which PathHelpers.SafePathCombine calls (after null-argument
              validation) to verify the resolved combined path has not escaped the base
              directory. Every SafePathCombine test that supplies non-null arguments exercises
              this polyfill on net481 test builds. On net5.0 and later the BCL provides the API
              and Polyfill is a no-op. The net481 test-project target (Windows-only) consumes the
              netstandard2.0 library binary and provides the primary evidence.
            tags: [ots]
            tests:
              - PathHelpers_SafePathCombine_ValidPaths_CombinesCorrectly
              - PathHelpers_SafePathCombine_PathTraversalWithDoubleDots_ThrowsArgumentException
              - PathHelpers_SafePathCombine_DoubleDotsInMiddle_ThrowsArgumentException
              - PathHelpers_SafePathCombine_AbsolutePath_ThrowsArgumentException
              - PathHelpers_SafePathCombine_DotDotPrefixedName_CombinesCorrectly
              - PathHelpers_SafePathCombine_CurrentDirectoryReference_CombinesCorrectly
              - PathHelpers_SafePathCombine_EmptyRelativePath_ReturnsBasePath
              - PathHelpers_SafePathCombine_SimpleFilename_CombinesCorrectly
              - PathHelpers_SafePathCombine_NestedPaths_CombinesCorrectly
              - PathHelpers_SafePathCombine_GuidBasedFilename_CombinesSuccessfully

          - id: Caching-OTS-Polyfill-ThrowIfNull
            title: >-
              Polyfill shall provide ArgumentNullException.ThrowIfNull on netstandard2.0
              targets where the API is absent.
            justification: |
              ArgumentNullException.ThrowIfNull is enabled via
              <PolyArgumentExceptions>true</PolyArgumentExceptions> in the project file.
              PathHelpers.SafePathCombine calls it to validate both parameters before any path
              logic runs. The two null-argument tests exercise this polyfill on net481 test
              builds; on net5.0 and later the BCL provides the API and Polyfill is a no-op.
            tags: [ots]
            tests:
              - PathHelpers_SafePathCombine_NullBasePath_ThrowsArgumentNullException
              - PathHelpers_SafePathCombine_NullRelativePath_ThrowsArgumentNullException
