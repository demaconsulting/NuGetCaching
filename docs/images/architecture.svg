<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- White rounded card keeps the diagram readable in light and dark themes -->
  <rect x="14" y="16" width="955" height="510" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="955" height="510" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(30,30)">
    <!-- Consumer -->
    <rect x="20" y="0" width="300" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="170" y="45" font-size="18" font-weight="600" fill="#92400e" text-anchor="middle">Your application</text>
    <text x="170" y="70" font-size="13" fill="#92400e" text-anchor="middle">build tool, test harness,</text>
    <text x="170" y="88" font-size="13" fill="#92400e" text-anchor="middle">CLI or GUI host</text>

    <!-- Options configured in code -->
    <rect x="360" y="0" width="320" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="520" y="25" font-size="15" font-family="Consolas, monospace" font-weight="600" fill="#92400e" text-anchor="middle">NuGetCacheOptions</text>
    <text x="520" y="44" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">optional, what you configure in code</text>
    <text x="520" y="66" font-size="12" fill="#92400e" text-anchor="middle">Sources · IncludeLocalSources</text>
    <text x="520" y="82" font-size="12" fill="#92400e" text-anchor="middle">CredentialCallback · Interactive · Logger</text>
    <text x="520" y="98" font-size="12" fill="#92400e" text-anchor="middle">AuthenticationTimeout · RequireSignedPackages</text>

    <!-- Library boundary -->
    <rect x="20" y="170" width="660" height="290" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="36" y="196" font-size="14" font-weight="600" fill="#2563eb">DemaConsulting.NuGet.Caching</text>

    <!-- Public entry point -->
    <rect x="40" y="215" width="620" height="230" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="350" y="245" font-size="18" font-family="Consolas, monospace" font-weight="600" fill="#166534" text-anchor="middle">NuGetCache</text>
    <text x="350" y="278" font-size="14" fill="#166534" text-anchor="middle">EnsureCachedAsync(id, version) → package path</text>
    <text x="350" y="302" font-size="14" fill="#166534" text-anchor="middle">GetVersionsAsync(id, includePrerelease) → version strings</text>
    <text x="350" y="326" font-size="14" fill="#166534" text-anchor="middle">ListVersionsAsync(id) → versions with source and status</text>
    <text x="350" y="350" font-size="14" fill="#166534" text-anchor="middle">GetCachedVersions(id) → versions already installed (offline)</text>
    <text x="350" y="388" font-size="12" fill="#15803d" text-anchor="middle">Uses your NuGet configuration or explicit sources, honors package source mapping,</text>
    <text x="350" y="406" font-size="12" fill="#15803d" text-anchor="middle">can verify package signatures, and separates sign-in failures from</text>
    <text x="350" y="424" font-size="12" fill="#15803d" text-anchor="middle">not-found and unreachable sources with actionable errors</text>

    <!-- Calls into the library and results back -->
    <line x1="120" y1="114" x2="120" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="110" y="136" font-size="12" fill="#334155" text-anchor="end">call</text>
    <text x="110" y="152" font-size="12" fill="#334155" text-anchor="end">asynchronously</text>
    <line x1="220" y1="166" x2="220" y2="114" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="230" y="136" font-size="12" fill="#334155">paths, versions</text>
    <text x="230" y="152" font-size="12" fill="#334155">or errors</text>
    <line x1="520" y1="114" x2="520" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="530" y="146" font-size="12" fill="#334155">options</text>

    <!-- External: config file -->
    <rect x="730" y="165" width="190" height="115" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="825" y="193" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">nuget.config</text>
    <text x="825" y="214" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">or configure it in a file</text>
    <text x="825" y="235" font-size="12" fill="#92400e" text-anchor="middle">package sources</text>
    <text x="825" y="251" font-size="12" fill="#92400e" text-anchor="middle">source mapping</text>
    <text x="825" y="267" font-size="12" fill="#92400e" text-anchor="middle">credentials</text>
    <line x1="726" y1="225" x2="664" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="695" y="217" font-size="12" fill="#334155" text-anchor="middle">read</text>

    <!-- External: feeds -->
    <rect x="730" y="295" width="190" height="85" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="825" y="323" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">NuGet feeds</text>
    <text x="825" y="345" font-size="12" fill="#475569" text-anchor="middle">nuget.org, private (HTTP/S)</text>
    <text x="825" y="363" font-size="12" fill="#475569" text-anchor="middle">local folders (file or UNC)</text>
    <line x1="664" y1="337" x2="726" y2="337" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

    <!-- External: global packages folder -->
    <rect x="730" y="395" width="190" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="825" y="425" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">Global packages</text>
    <text x="825" y="447" font-size="12" fill="#475569" text-anchor="middle">shared NuGet package cache</text>
    <path d="M664,410 H700 V430 H726" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="700" y="455" font-size="12" fill="#334155" text-anchor="middle">install</text>
  </g>
</svg>
