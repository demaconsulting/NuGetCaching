<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. A package id and version, the nuget.config sources, credentials, and the global
       packages folder flow into the NuGetCache .NET library and come out as the package cached at its path in
       the global packages folder, the list of available versions, their listed state and publication dates,
       and authentication failures classified as 401 or 403.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 40px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176" style="font-size:70px">NuGet</text>
  <text class="word brandText" x="262" y="176" style="font-size:70px">Caching</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">Every package, cached.</text>
  <text class="tag brandText" x="56" y="316">Every version, found.</text>
  <text class="body" x="58" y="368">A .NET library that resolves NuGet</text>
  <text class="body" x="58" y="402">versions and downloads packages from</text>
  <text class="body" x="58" y="436">your feeds into the global cache.</text>
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd" x="78" y="503">var path = await NuGetCache</text>
  <text class="cmd" x="108" y="539">.EnsureCachedAsync(</text>
  <text class="cmd file" x="393" y="539">id, v</text>
  <text class="cmd" x="468" y="539">);</text>
  <text class="note" x="58" y="604">Honors nuget.config, like dotnet.</text>

  <!-- Input cards -->
  <g>
    <!-- Input one: the package id and the version to cache -->
    <rect class="card" x="580" y="40" width="236" height="160" rx="16"/>
    <rect x="642" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(588 48)">
      <path d="M48 18 L76 32 L48 46 L20 32 Z" fill="#fde68a"/>
      <path d="M20 32 L48 46 L48 90 L20 76 Z" fill="#fbbf24"/>
      <path d="M76 32 L48 46 L48 90 L76 76 Z" fill="#d97706"/>
      <path d="M34 25 L62 39 L62 50" fill="none" stroke="#92400e" stroke-width="3"/>
      <rect x="92" y="18" width="116" height="34" rx="7" fill="#ffffff" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1.5"/>
      <text class="miniMono" x="150" y="43" fill="#f8fafc" text-anchor="middle">Serilog</text>
      <rect x="92" y="62" width="116" height="34" rx="17" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.5"/>
      <text class="miniMono" x="150" y="87" fill="#fde68a" text-anchor="middle">4.2.0</text>
    </g>
    <text class="label" x="698" y="190">Id + version</text>

    <!-- Input two: nuget.config with its package sources -->
    <rect class="card" x="828" y="40" width="236" height="160" rx="16"/>
    <rect x="890" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="836" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(836 48)">
      <path class="page" d="M24 12 L68 12 L84 28 L84 100 L24 100 Z"/>
      <path d="M68 12 L68 28 L84 28 Z" fill="#cbd5e1"/>
      <rect x="34" y="40" width="40" height="5" rx="2.5" fill="#22d3ee"/>
      <rect class="bar" x="34" y="52" width="40" height="5" rx="2.5"/>
      <rect class="bar" x="34" y="64" width="30" height="5" rx="2.5"/>
      <rect class="bar" x="34" y="76" width="36" height="5" rx="2.5"/>
      <rect x="104" y="18" width="92" height="32" rx="7" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.5"/>
      <text class="mini" x="150" y="42" fill="#a5f3fc" text-anchor="middle">.config</text>
      <circle cx="110" cy="70" r="5" fill="#22d3ee"/>
      <rect class="bar" x="122" y="66" width="74" height="8" rx="4" fill-opacity="0.75"/>
      <circle cx="110" cy="88" r="5" fill="#22d3ee"/>
      <rect class="bar" x="122" y="84" width="54" height="8" rx="4" fill-opacity="0.75"/>
    </g>
    <text class="label" x="946" y="190">nuget.config</text>

    <!-- Input three: credentials for private feeds -->
    <rect class="card" x="1076" y="40" width="236" height="160" rx="16"/>
    <rect x="1138" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1084" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(1084 48)">
      <circle cx="46" cy="40" r="17" fill="none" stroke="#f472b6" stroke-width="7"/>
      <path d="M58 52 L92 86" stroke="#f472b6" stroke-width="7" stroke-linecap="round"/>
      <path d="M78 72 L68 82 M86 80 L78 88" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
      <rect x="104" y="20" width="96" height="34" rx="7" fill="#ffffff" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.6" stroke-width="1.5"/>
      <g fill="#fbcfe8">
        <circle cx="122" cy="37" r="5"/>
        <circle cx="140" cy="37" r="5"/>
        <circle cx="158" cy="37" r="5"/>
        <circle cx="176" cy="37" r="5"/>
      </g>
      <text class="miniMono" x="152" y="88" fill="#fbcfe8" text-anchor="middle">user</text>
    </g>
    <text class="label" x="1194" y="190">Credentials</text>

    <!-- Input four: the global packages folder -->
    <rect class="card" x="1324" y="40" width="236" height="160" rx="16"/>
    <rect x="1386" y="40" width="112" height="3" rx="1.5" fill="#60a5fa"/>
    <rect class="panel" x="1332" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(1332 48)">
      <path d="M78 12 L102 12 L110 20 L142 20 L142 66 L78 66 Z" fill="#60a5fa"/>
      <path d="M78 28 L142 28 L142 66 L78 66 Z" fill="#93c5fd"/>
      <text class="miniMono" x="110" y="98" fill="#bfdbfe" text-anchor="middle">~/.nuget</text>
    </g>
    <text class="label" x="1442" y="190">Packages folder</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M698,206 C698,236 950,226 950,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M946,206 C946,236 1030,226 1030,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1194,206 C1194,236 1110,226 1110,253" stroke="#f472b6" marker-end="url(#headPink)"/>
    <path d="M1442,206 C1442,236 1190,226 1190,253" stroke="#60a5fa" marker-end="url(#headBlue)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="698" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="946" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1194" cy="206" r="5" fill="#f472b6"/>
    <circle cx="1442" cy="206" r="5" fill="#60a5fa"/>
  </g>
  <!-- The engine: the NuGetCache class of the library -->
  <rect x="834" y="262" width="472" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="834" y="262" width="472" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="858" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M876 282 L888 288 L876 294 L864 288 Z" fill="#ffffff"/>
  <path d="M864 290 L875 295.5 L875 307 L864 301.5 Z" fill="#ffffff"/>
  <path d="M888 290 L877 295.5 L877 307 L888 301.5 Z" fill="#ffffff"/>
  <text class="engine" x="910" y="305">NuGetCache</text>
  <line x1="1114" y1="278" x2="1114" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1134" y="303">.NET library</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Output one: the package extracted into the global packages folder; the returned path -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <path d="M606 414 L620 414 L625 419 L640 419 L640 440 L606 440 Z" fill="#60a5fa"/>
    <text class="miniMono" x="652" y="436" fill="#e2e8f0">packages/</text>
    <path d="M628 448 L628 470 L644 470" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text class="miniMono" x="652" y="478" fill="#e2e8f0">serilog/</text>
    <path d="M664 488 L664 512 L680 512" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text class="miniMono" x="688" y="520" fill="#5eead4">4.2.0/</text>
    <rect x="778" y="497" width="84" height="32" rx="7" fill="#5eead4" fill-opacity="0.14" stroke="#5eead4" stroke-width="1.5"/>
    <text class="mini" x="820" y="520" fill="#99f6e4" text-anchor="middle">.nupkg</text>
    <text class="label" x="728" y="585">Cached package</text>

    <!-- Output two: the available versions, normalized and ascending -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <path d="M928 420 L928 522" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" marker-end="url(#headViolet)"/>
    <text class="miniMono" x="958" y="440" fill="#cbd5e1">4.0.0</text>
    <text class="miniMono" x="958" y="482" fill="#cbd5e1">4.1.0</text>
    <rect x="948" y="499" width="88" height="32" rx="7" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="1.5"/>
    <text class="miniMono" x="958" y="523" fill="#ede9fe">4.2.0</text>
    <text class="label" x="999" y="585">Versions</text>

    <!-- Output three: version details, listed state and publication date -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <rect x="1146" y="414" width="30" height="28" rx="4" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="1146" y="414" width="30" height="8" rx="3" fill="#fbbf24"/>
    <rect class="bar" x="1188" y="424" width="126" height="8" rx="4" fill-opacity="0.75"/>
    <line x1="1146" y1="456" x2="1318" y2="456" stroke="#ffffff" stroke-opacity="0.15"/>
    <text class="miniMono" x="1146" y="490" fill="#f8fafc">4.2.0</text>
    <rect x="1222" y="468" width="102" height="30" rx="15" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="1.5"/>
    <text class="mini" x="1273" y="490" fill="#bbf7d0" text-anchor="middle">listed</text>
    <text class="miniMono" x="1146" y="532" fill="#94a3b8">4.1.0</text>
    <rect x="1222" y="510" width="102" height="30" rx="15" fill="#94a3b8" fill-opacity="0.16" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="mini" x="1273" y="532" fill="#cbd5e1" text-anchor="middle">unlisted</text>
    <text class="label" x="1232" y="585">Listed + dates</text>

    <!-- Output four: an authentication failure classified as 401 or 403 -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <circle cx="1457" cy="448" r="26" fill="url(#brand)"/>
    <path d="M1449 446 L1449 438 A8 8 0 0 1 1465 438 L1465 446" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <rect x="1443" y="445" width="28" height="20" rx="4" fill="#ffffff"/>
    <circle cx="1457" cy="455" r="3" fill="#7c3aed"/>
    <rect x="1385" y="494" width="144" height="38" rx="8" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.7" stroke-width="1.5"/>
    <text class="miniMono" x="1457" y="520" fill="#fbcfe8" text-anchor="middle">401 / 403</text>
    <text class="label" x="1457" y="585">Auth errors</text>
  </g>
</svg>
